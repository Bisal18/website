<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitness Tools | NeonForge Fitness</title>
  <meta name="description" content="Free BMI, BMR and macro calculators from NeonForge Fitness, Hyderabad.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
  <script src="components.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <main>
    <section class="page-hero hero-sm">
      <div id="canvas-container" data-scene="particles"></div>
      <div class="container hero-content">
        <h1>Fitness <span class="gradient-text">Calculators</span></h1>
        <p>Free tools to understand your body and plan your nutrition.</p>
      </div>
    </section>

    <div class="container" style="padding: 40px 20px 100px;">
      <div class="grid-3">
        <div class="glass-panel reveal" style="padding: 40px;">
          <h2>BMI Calculator</h2>
          <form id="bmi-form" style="margin-top: 20px;">
            <label>Height (cm)</label>
            <input type="number" id="height" required placeholder="e.g. 175">
            <label>Weight (kg)</label>
            <input type="number" id="weight" required placeholder="e.g. 70">
            <button type="submit" class="btn-glow" style="width: 100%;">Calculate</button>
          </form>
          <div id="bmi-result" style="margin-top: 20px; text-align: center;"></div>
        </div>

        <div class="glass-panel reveal" style="padding: 40px;">
          <h2>BMR &amp; TDEE Calculator</h2>
          <form id="bmr-form" style="margin-top: 20px;">
            <label>Gender</label>
            <select id="bmr-gender" required>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
            <label>Age</label>
            <input type="number" id="bmr-age" required placeholder="e.g. 28">
            <label>Height (cm)</label>
            <input type="number" id="bmr-height" required placeholder="e.g. 175">
            <label>Weight (kg)</label>
            <input type="number" id="bmr-weight" required placeholder="e.g. 70">
            <label>Activity Level</label>
            <select id="bmr-activity" required>
              <option value="1.2">Sedentary (little/no exercise)</option>
              <option value="1.375">Light (1-3 days/week)</option>
              <option value="1.55" selected>Moderate (3-5 days/week)</option>
              <option value="1.725">Active (6-7 days/week)</option>
              <option value="1.9">Very Active (athlete)</option>
            </select>
            <button type="submit" class="btn-glow" style="width: 100%;">Calculate</button>
          </form>
          <div id="bmr-result" style="margin-top: 20px; text-align: center;"></div>
        </div>

        <div class="glass-panel reveal" style="padding: 40px;">
          <h2>Macro Split Calculator</h2>
          <form id="macro-form" style="margin-top: 20px;">
            <label>Daily Calorie Target</label>
            <input type="number" id="macro-calories" required placeholder="e.g. 2200">
            <label>Goal</label>
            <select id="macro-goal" required>
              <option value="maintain">Maintain</option>
              <option value="cut">Cut (Fat Loss)</option>
              <option value="bulk">Bulk (Muscle Gain)</option>
            </select>
            <button type="submit" class="btn-glow" style="width: 100%;">Calculate</button>
          </form>
          <div id="macro-result" style="margin-top: 20px; text-align: center;"></div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
